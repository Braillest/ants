<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/assets/style.css">

    <!-- Title and Description -->
    <title>Braillest</title>
    <meta name="description"
        content="Braillest.com offers open-source braille publishing tools, custom mold generation software, and affordable solutions for creating, binding, and sharing accessible braille materials.">

    <!-- Icons -->
    <link rel="icon" href="/assets/braillest.png" type="image/png">
    <link rel="apple-touch-icon" href="/assets/braillest.png" type="image/png">

    <!-- Canonical URL -->
    <link rel="canonical" href="https://braillest.com">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Braillest | Open-source braille publishing tools">
    <meta property="og:description"
        content="Braillest.com offers open-source braille publishing tools, custom mold generation software, and affordable solutions for creating, binding, and sharing accessible braille materials.">
    <meta property="og:url" content="https://braillest.com">
    <meta property="og:image" content="/assets/braillest-social.png">
    <meta property="og:site_name" content="braillest">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Braillest | Open-source braille publishing tools">
    <meta name="twitter:description"
        content="Braillest.com offers open-source braille publishing tools, custom mold generation software, and affordable solutions for creating, binding, and sharing accessible braille materials.">
    <meta name="twitter:image" content="/assets/braillest-social.png">

    <!-- Robots and Crawlers -->
    <meta name="robots" content="index, nofollow">
    <meta name="googlebot" content="index, nofollow">

    <meta name="language" content="English">
    <meta property="og:locale" content="en_US">
    <meta name="author" content="Lewis Brown">
    <meta name="rating" content="general">

    <!-- Schema.org (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://braillest.com/",
        "name": "braillest"
    }
    </script>
</head>

<body>
    <div id="app"></div>
    <script type="module" src="main.js"></script>
</body>

</html>
