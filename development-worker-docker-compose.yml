services:
  worker_celery:
    build:
      context: .
      dockerfile: docker/development/worker/celery/Dockerfile
    container_name: ants_development_worker_celery
    env_file:
      - docker/development/worker/celery/.env.local
    image: ants_development_worker_celery
    networks:
      - ants_development_worker
    volumes:
      - ./src/tasks:/worker
networks:
  ants_development_worker:
    name: ants_development_worker
    driver: bridge
  ants_development_queen:
    name: ants_development_queen
    external: true
